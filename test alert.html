<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            text-align: center;
            
        }
        form {
            display: inline-block;
            text-align: left;
        }
    body {
        font-family: Arial, sans-serif;
        background-color: #a7dae7;
        text-align: center;
        margin-top: 50px;
    }

    h2 {
        margin-bottom: 20px;
    }

    form {
        background-color: #fdffff;
        padding: 20px 25px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        display: inline-block;
        text-align: left;
        width: 300px;
    }

    label {
        font-weight: bold;
    }

    input[type="text"] {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    input[type="submit"] {
        width: 100%;
        padding: 10px;
        background-color: #4c8baf;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    input[type="submit"]:hover {
        background-color: #458ba0;
    }
    </style>
</head>
<body>

    <h2>Registrasi Form</h2>

    <form action="#" onsubmit="return validateForm()">
        <label>Nama</label><br>
        <input type="text" id="fname" placeholder="Nama Lengkap"><br><br>

        <label>Email</label><br>
        <input type="text" id="email" placeholder="Email"><br><br>

        <label>Nomor Telepon</label><br>
        <input type="text" id="phone" placeholder="Nomor Telepon"><br><br>

        <label>Pesan</label><br>
        <input type="text" id="message" placeholder="Pesan"><br><br>

        <input type="submit" value="Sign Up">
    </form>

    <script>
        function validateForm() {
            var fname = document.getElementById("fname").value;
            var email = document.getElementById("email").value;
            var phone = document.getElementById("phone").value;
            var message = document.getElementById("message").value;

            // cek kosong
            if (fname === "" || email === "" || phone === "" || message === "") {
                alert("Tolong isi semua data yang diperlukan!");
                return false;
            }

            // konfirmasi kirim
            var confirmSend = confirm("Apakah Anda yakin ingin mengirim formulir ini?");
            
            if (confirmSend) {
                alert("Formulir berhasil dikirim");
                return true;
            } else {
                alert("Formulir dibatalkan");
                return false;
            }
        }
    </script>
    


</body>
</html>
